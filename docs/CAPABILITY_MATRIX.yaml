# SentinelFlow Verified Capability Matrix
#
# Single source of truth. All documentation, README claims, Devpost
# submissions, and architecture diagrams are derived from this file.
#
# Legal status vocabulary (strictly enforced by scripts/generate_docs.py):
#   TESTED       — Implemented AND covered by automated tests in CI
#   IMPLEMENTED  — Code/schema exists but full integration test suite pending
#   DEMO_ONLY    — Development or demonstration profile implementation only
#   EXPERIMENTAL — Proof-of-concept implementation
#   PLANNED      — Designed in architecture specification; implementation pending
#
# The scripts/generate_docs.py script reads this file and generates:
#   - README.md claims section
#   - docs/engineering/CURRENT_STATE.md capability table
#   - docs/DEVPOST_SUBMISSION.md

