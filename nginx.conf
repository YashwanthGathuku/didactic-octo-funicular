server {
    listen 8080 default_server;
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/v1/ {
        proxy_pass https://sentinelflow-gateway-axrdwvptka-uc.a.run.app/api/v1/;
        proxy_set_header Host sentinelflow-gateway-axrdwvptka-uc.a.run.app;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

