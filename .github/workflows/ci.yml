name: CI

on:
  push:
    branches: [main]
  pull_request:

# Versions are pinned to exactly what go.mod, .nvmrc and pyproject.toml declare.
# CI previously used Go 1.22 against a go.mod requiring 1.26.4, and Python 3.11
# against a package declaring >=3.12.
env:
  GO_VERSION: "1.25.8"
  NODE_VERSION: "22.22.2"
  PYTHON_VERSION: "3.11"

jobs:
  go:
    name: Go — format, vet, test, race
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: gateway/go.sum

      # Formatting is a gate, not a suggestion. Eight files were unformatted
      # before this pipeline existed.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Verify go.mod is tidy
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          diff -q go.mod go.mod.bak || { echo "go.mod is not tidy; run 'go mod tidy'"; exit 1; }
          diff -q go.sum go.sum.bak || { echo "go.sum is not tidy; run 'go mod tidy'"; exit 1; }

      - name: Build
        run: go build ./...

      - name: Unit and integration tests
        run: go test ./...

      # Concurrency defects in an audit chain do not surface without this.
      - name: Race tests
        run: go test -race ./...

  migrations:
    name: Migrations — apply, idempotency, upgrade
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: gateway/go.sum

      - name: Migration behaviour tests
        run: go test -run 'TestMigrate|TestMigration|TestDemoSeed' -v ./...

      # Exercises the real command path, not only the library.
      - name: Migrate a clean database, then prove it is idempotent
        env:
          SENTINEL_PROFILE: local-demo
          DATABASE_URL: /tmp/ci-sentinel.db
        run: |
          go build -o /tmp/gw .
          /tmp/gw migrate
          /tmp/gw migrate status
          /tmp/gw migrate            # second run must apply nothing
          /tmp/gw migrate status     # exits non-zero if anything is pending

  config:
    name: Configuration — production fails closed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: gateway/go.sum

      - name: Configuration validation tests
        run: go test -run 'TestProduction|TestDemoProfile|TestUnknownProfile|TestMalformed|TestConfigured' -v ./...

      - name: A production profile with no configuration must refuse to start
        run: |
          go build -o /tmp/gw .
          if SENTINEL_PROFILE=production /tmp/gw; then
            echo "FAIL: the gateway started in the production profile with no configuration"
            exit 1
          fi
          echo "OK: refused to start, as required"

  frontend:
    name: Frontend — typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

      # Fails the build on a high or critical advisory rather than reporting it
      # into a log nobody reads.
      - name: Dependency audit
        run: npm audit --audit-level=high

  python:
    name: Python AI tier — lint, import, evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-tier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Import check
        run: python -c "import main, swarm, llm_client, agent_hub_tools"

      # runner.py exits non-zero with NOT_RUN when no system under test is
      # wired up. That refusal is correct behaviour, so the job asserts it
      # rather than treating a missing evaluation as a pass.
      - name: Adversarial evals report honestly when unwired
        run: |
          set +e
          output=$(python evals/runner.py); code=$?
          set -e
          echo "$output"
          if [ $code -eq 0 ]; then
            echo "$output" | grep -q '"status": *"COMPLETED"' || {
              echo "FAIL: evals exited 0 without completing"; exit 1; }
          else
            echo "$output" | grep -q 'NOT_RUN' || {
              echo "FAIL: evals failed without reporting NOT_RUN"; exit 1; }
            echo "OK: evals refused to emit a pass rate it did not measure"
          fi

  postgres-rls:
    name: PostgreSQL row-level security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          # secret-scan-allow: ephemeral job-local service container; the port is not published outside the runner and the database is destroyed with the job. A services block is evaluated before any step runs, so a generated value cannot be substituted here.
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: gateway/go.sum

      # The application role must own nothing and be no superuser, or it would
      # bypass the very policies under test.
      - name: Apply schema as owner and create a least-privilege app role
        env:
          # secret-scan-allow: matches the ephemeral service container above; destroyed with the job and never reachable off the runner
          PGPASSWORD: ci-postgres-password
        run: |
          psql -h localhost -U postgres -d sentinel_test \
            -f gateway/migrations_postgres/001_schema_and_rls.sql
          psql -h localhost -U postgres -d sentinel_test -c \
            "CREATE ROLE sentinel_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOCREATEDB NOCREATEROLE;"  # secret-scan-allow: least-privilege role in the ephemeral CI database; exists only for the duration of this job
          psql -h localhost -U postgres -d sentinel_test -c \
            "GRANT SELECT,INSERT,UPDATE ON partners,file_instances,incidents,audit_events,secret_versions,secret_events,tenant_quotas,ingest_idempotency,artifact_access_log TO sentinel_app;"
          # No DELETE is granted anywhere. The append-only trigger is the
          # primary defence for the audit trail; withholding the grant is the
          # second.
          psql -h localhost -U postgres -d sentinel_test -c \
            "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sentinel_app;"
          psql -h localhost -U postgres -d sentinel_test -c \
            "INSERT INTO tenants (id,name) VALUES ('TENANT-ALPHA','Alpha'),('TENANT-BETA','Beta');"

      - name: Row-level security tests
        working-directory: ./gateway
        env:
          SENTINEL_TEST_POSTGRES_DSN: postgres://sentinel_app:ci-app-password@localhost:5432/sentinel_test?sslmode=disable
        run: go test -run 'TestRls|TestApplicationRole|TestSecretMaterial' -v ./internal/repository/

      # A skip here would mean the security property went unverified, so assert
      # the tests actually ran.
      - name: Assert the RLS tests were not skipped
        working-directory: ./gateway
        env:
          SENTINEL_TEST_POSTGRES_DSN: postgres://sentinel_app:ci-app-password@localhost:5432/sentinel_test?sslmode=disable
        run: |
          out=$(go test -run 'TestRls|TestApplicationRole|TestSecretMaterial' -v ./internal/repository/ 2>&1)
          if echo "$out" | grep -q "SKIP"; then
            echo "FAIL: row-level security tests were skipped"; echo "$out"; exit 1
          fi
          echo "OK: RLS tests executed against a real PostgreSQL server"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves each image builds from a clean checkout. Containerfile.ai could
      # not build at all before ai-tier/requirements.txt existed.
      - name: Build gateway image
        run: docker build -f Containerfile.gateway -t sentinel-gateway:ci .
      - name: Build AI tier image
        run: docker build -f Containerfile.ai -t sentinel-ai-tier:ci .
      - name: Build UI image
        run: docker build -f Containerfile.ui -t sentinel-ui:ci .
