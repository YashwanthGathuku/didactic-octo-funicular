name: SentinelFlow CI Pipeline

on:
  push:
    branches: [main, "release/**", "claude/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Static Analysis, Formatting & Type Checking
  # --------------------------------------------------------------------------
  lint-and-format:
    name: Lint, Format & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'gateway/go.mod'
          cache-dependency-path: 'gateway/go.sum'

      - name: Verify Go Formatting
        run: |
          diffs=$(gofmt -s -l gateway/)
          if [ -n "$diffs" ]; then
            echo "Unformatted Go files found:"
            echo "$diffs"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          working-directory: gateway
          args: --timeout=5m

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Frontend TypeScript & Lint Check
        run: |
          npx tsc --noEmit

  # --------------------------------------------------------------------------
  # 2. Go Unit, Integration & Race Tests
  # --------------------------------------------------------------------------
  test-backend:
    name: Go Tests with Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'gateway/go.mod'
          cache-dependency-path: 'gateway/go.sum'

      - name: Run Go Test Suite with Race Detector
        working-directory: gateway
        run: |
          go test -race -v -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check Backend Code Coverage
        working-directory: gateway
        run: |
          go tool cover -func=coverage.out

  # --------------------------------------------------------------------------
  # 3. Frontend Tests and Production Build
  # --------------------------------------------------------------------------
  test-frontend:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Run Production Bundle Build
        run: npm run build

  # --------------------------------------------------------------------------
  # 4. Python AI Tier Evals & Adversarial Checks
  # --------------------------------------------------------------------------
  test-ai-tier:
    name: Python AI Tier Evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy pydantic requests
          if [ -f ai-tier/requirements.txt ]; then pip install -r ai-tier/requirements.txt; fi

      - name: Lint AI Tier
        run: |
          ruff check ai-tier/

      - name: Run AI Adversarial Evals
        run: |
          python ai-tier/evals/runner.py

  # --------------------------------------------------------------------------
  # 5. Database Migration & Clean-Stack Smoke Test
  # --------------------------------------------------------------------------
  test-migrations:
    name: Database Migrations Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'gateway/go.mod'
          cache-dependency-path: 'gateway/go.sum'

      - name: Run Migration Integration Tests
        working-directory: gateway
        run: |
          go test -v -run "TestMigration" .

  # --------------------------------------------------------------------------
  # 6. Security Hygiene, Vulnerability Scanning & License Audit
  # --------------------------------------------------------------------------
  security-and-license-scan:
    name: Security Hygiene, Govulncheck & License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'gateway/go.mod'
          cache-dependency-path: 'gateway/go.sum'

      - name: Run Secret Hygiene Scan
        working-directory: gateway
        run: |
          go test -v -run "TestNoLiteralSecretsInSourceOrConfig" .

      - name: Run Govulncheck (Go Vulnerability Database)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd gateway && govulncheck ./...

      - name: Run Trivy Vulnerability Scanner (Repo Files)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
