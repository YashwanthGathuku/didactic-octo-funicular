name: SentinelFlow Submission Mechanical Autofix

on:
  push:
    branches:
      - chatgpt/submission-hardening-2026-08-23
    paths-ignore:
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: submission-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mechanical-autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/submission-hardening-2026-08-23
          fetch-depth: 0

      - name: Setup Go 1.25.13
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: gateway/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check 'ruff==0.12.2'

      - name: Apply Go formatting and patch-level security updates
        shell: bash
        run: |
          set -euo pipefail
          gofmt -s -w gateway/
          cd gateway
          go mod edit -go=1.25.13
          go get github.com/cloudflare/circl@v1.6.3
          go mod tidy

      - name: Apply Python lint fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check ai-tier --fix
          python -m ruff format ai-tier

      - name: Commit mechanical changes if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No mechanical changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gateway ai-tier
          git commit -m 'chore(submission): normalize formatting and patch Go security versions'
          git push origin HEAD:chatgpt/submission-hardening-2026-08-23
