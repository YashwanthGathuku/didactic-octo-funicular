name: SentinelFlow Submission Mechanical Autofix

on:
  push:
    branches:
      - chatgpt/submission-hardening-2026-08-23
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: submission-autofix-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  mechanical-autofix:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.ref_name == 'chatgpt/submission-hardening-2026-08-23' ||
       github.head_ref == 'chatgpt/submission-hardening-2026-08-23')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/submission-hardening-2026-08-23
          fetch-depth: 0

      - name: Setup Go 1.25.13
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: gateway/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check 'ruff==0.12.2'

      - name: Bind managed workflow state into trusted Tool Gateway context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("gateway/managed_agent_tools.go")
          text = path.read_text(encoding="utf-8")
          if "WorkflowState:" not in text:
              pattern = r"(\n\s*WorkflowID:\s+workflowID,)(\n\s*ArtifactID:)"
              text, count = re.subn(pattern, r"\1\n\t\t\tWorkflowState:       workflowState,\2", text, count=1)
              if count != 1:
                  raise SystemExit("managed workflow-state insertion target not found")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Apply Go formatting and patch-level security updates
        shell: bash
        run: |
          set -euo pipefail
          gofmt -s -w gateway/
          cd gateway
          go mod edit -go=1.25.13
          go get github.com/cloudflare/circl@v1.6.3
          go mod tidy

      - name: Apply Python mechanical fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          # These two Ruff classes are limited to removing unused locals and
          # rewriting an assigned lambda as a function. The full test suite is
          # the semantic gate after this mechanical normalization.
          python -m ruff check ai-tier --select F841,E731 --fix --unsafe-fixes
          python -m ruff check ai-tier --fix
          python -m ruff format ai-tier
          python -m ruff check ai-tier

      - name: Commit mechanical changes if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No mechanical changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gateway ai-tier
          git commit -m 'chore(submission): normalize formatting and patch dependency state'
          git push origin HEAD:chatgpt/submission-hardening-2026-08-23
