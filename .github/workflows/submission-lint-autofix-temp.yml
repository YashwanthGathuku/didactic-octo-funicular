name: SentinelFlow Submission Lint Autofix TEMP

on:
  push:
    branches:
      - chatgpt/submission-hardening-2026-08-23

permissions:
  contents: write

concurrency:
  group: submission-lint-autofix-temp
  cancel-in-progress: false

jobs:
  mechanical-lint-autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/submission-hardening-2026-08-23
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Run safe golangci autofixes
        uses: golangci/golangci-lint-action@v9
        continue-on-error: true
        with:
          version: v2.12.2
          working-directory: gateway
          args: --timeout=5m --fix

      - name: Normalize Go formatting
        run: gofmt -s -w gateway/

      - name: Commit mechanical changes if any
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No mechanical lint changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gateway
          git commit -m 'chore(submission): apply safe Go lint autofixes'
          git fetch origin chatgpt/submission-hardening-2026-08-23
          git rebase origin/chatgpt/submission-hardening-2026-08-23
          git push origin HEAD:chatgpt/submission-hardening-2026-08-23
