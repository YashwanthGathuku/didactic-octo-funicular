name: SentinelFlow Release & Provenance Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write # Required for Cosign OIDC keyless signing

jobs:
  release-build-and-provenance:
    name: Build, SBOM & Sign Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'gateway/go.mod'
          cache-dependency-path: 'gateway/go.sum'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Syft (SBOM Generator)
        uses: anchore/sbom-action/download-syft@v0.17.0

      - name: Install Cosign (Artifact Signer)
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and Push Gateway Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Generate CycloneDX and SPDX SBOMs
        run: |
          syft dir:. -o cyclonedx-json=sbom.cyclonedx.json
          syft dir:. -o spdx-json=sbom.spdx.json

      - name: Sign Container Image with Cosign
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build-push.outputs.digest }}"

      - name: Attach SBOM Attestation with Cosign
        run: |
          cosign attest --yes --predicate sbom.cyclonedx.json --type cyclonedx "ghcr.io/${{ github.repository }}@${{ steps.build-push.outputs.digest }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.cyclonedx.json
            sbom.spdx.json
          generate_release_notes: true
