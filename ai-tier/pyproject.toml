[project]
name = "sentinel-ai-tier"
version = "0.2.0"
description = "Governed read-only AI analysis and diagnosis tier for SentinelFlow using Google ADK and Gemini."
readme = "README.md"
requires-python = ">=3.11"

# Authoritative Dependency Source of Truth
# Pinned to exact major/minor compatible ranges verified during SGACA P05 runtime testing
dependencies = [
    "fastapi>=0.115.6,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "pydantic>=2.10.4,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "google-genai>=2.18.1,<3.0.0",
    "google-adk>=2.7.1,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "requests>=2.32.3,<3.0.0",
    "ruff>=0.8.4,<1.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
