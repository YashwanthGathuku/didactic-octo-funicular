[project]
name = "sentinel-ai-tier"
version = "0.1.0"
description = "Optional asynchronous AI analysis tier for Sentinel Flow. Never part of deterministic ingestion."
readme = "README.md"

# Pinned to 3.11 to match Containerfile.ai and CI. This previously declared
# >=3.12 while every environment that actually ran it used 3.11.
requires-python = ">=3.11,<3.12"

# Only what is genuinely imported. langchain was declared here but appears in no
# import statement in this package; it has been removed rather than installed.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
]

[project.optional-dependencies]
# openai is imported under a runtime guard in llm_client.py and is only reached
# when OPENAI_API_KEY is set. Absence produces UNAVAILABLE, never a generated
# answer, so it is not a runtime requirement.
llm = ["openai==1.59.6"]
dev = ["requests==2.32.3", "ruff==0.8.4"]

[tool.ruff]
target-version = "py311"
line-length = 100
