version: '3.8'

services:
  # 1. Python FastAPI AI Exception Analyst Tier (Astra 2.0)
  ai-tier:
    container_name: sentinel-ai-tier
    build:
      context: .
      dockerfile: Containerfile.ai
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # - OPENAI_API_KEY=${OPENAI_API_KEY} # Optional for live LLM mode
    restart: unless-stopped
    networks:
      - sentinel-net

  # 2. Go High-Throughput Pre-Ledger Gateway Monolith
  gateway:
    container_name: sentinel-gateway
    build:
      context: .
      dockerfile: Containerfile.gateway
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/inbox:/app/inbox:Z
      - sentinel-data:/app/data:Z
    environment:
      - PORT=8080
      - AI_TIER_URL=http://ai-tier:8000
    depends_on:
      - ai-tier
    restart: unless-stopped
    networks:
      - sentinel-net

  # 3. React 18 Institutional Operations Cockpit PWA
  ui:
    container_name: sentinel-ui
    build:
      context: .
      dockerfile: Containerfile.ui
    ports:
      - "3000:3000"
    depends_on:
      - gateway
      - ai-tier
    restart: unless-stopped
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

volumes:
  sentinel-data:
    driver: local
