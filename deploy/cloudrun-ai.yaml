apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sentinel-ai-tier
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/${PROJECT_ID}/sentinel-repo/ai-tier:latest
          ports:
            - name: http1
              containerPort: 8000
          resources:
            limits:
              cpu: "2000m"
              memory: "1024Mi"
          env:
            - name: PORT
              value: "8000"
            - name: GOOGLE_CLOUD_PROJECT
              value: "${PROJECT_ID}"
            - name: MODEL_ARMOR_ENDPOINT
              value: "https://modelarmor.googleapis.com/v1"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-gemini-api-key
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
